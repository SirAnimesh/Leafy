<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pagination • Strategies</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <h1>Movies <small>- Pagination Strategies</small></h1>
      <div class="controls">
        <label>Strategy <select id="strategy"></select></label>
        <label>View
          <select id="mode">
            <option value="paged">Paged</option>
            <option value="infinite">Infinite Scroll</option>
          </select>
        </label>
        <button id="insert" type="button">+ Insert movie</button>
        <button id="reset" type="button">Reset demo</button>
      </div>
      <p class="hint">Insert a movie, then page forward: offset duplicates, cursor stays clean</p>
      <p class="status">
        <span id="status">Loading...</span>
        <span id="metrics"></span>
        <span id="dupes"></span>
      </p>
    </header>

    <main id="grid" class="grid" aria-live="polite"></main>

    <div id="sentinel" class="sentinel"></div>
    <p id="end" class="end" hidden>- end of list -</p>

    <footer class="pager">
      <button id="prev" type="button">Prev</button>
      <span id="page-indicator">1</span>
      <button id="next" type="button">Next</button>
    </footer>

    <template id="card">
      <article class="card">
        <img class="poster" loading="lazy" alt="">
        <div class="meta">
          <h2 class="title"></h2>
          <p class="year"></p>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
